<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Uplink — Тренажёр экзамена (02.02.2026)</title>
  <style>
    :root{
      --bg:#0f1419; --panel:#121b23; --panel2:#111a22;
      --text:#e9edef; --muted:#9aa1a7; --border:#2a3641;
      --accent:#0a86f9; --ok:#2ecc71; --bad:#ff5c5c; --warn:#f1c40f;
      --radius:14px;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box}
    html, body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:linear-gradient(180deg, #0f1419, #0b0f14);
      color:var(--text);
    }

    header{
      position:sticky; top:0; z-index:5;
      background:rgba(15,20,25,.85); backdrop-filter: blur(10px);
      border-bottom:1px solid var(--border);
      padding-top: var(--safe-top);
    }

    .wrap{max-width:900px; margin:0 auto; padding:12px 14px;}
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
    .row.nowrap{flex-wrap:nowrap}
    .title{font-size:16px; font-weight:800; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .pill{
      font-size:12px; padding:6px 10px;
      border:1px solid var(--border); border-radius:999px;
      color:var(--muted);
      white-space:nowrap;
    }
    .spacer{flex:1}

    .btn{
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      padding:10px 12px;
      border-radius:12px;
      cursor:pointer;
      transition:.15s;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{transform: translateY(1px);}
    .btn.primary{background:rgba(10,134,249,.12); border-color:rgba(10,134,249,.5);}
    .btn.good{background:rgba(46,204,113,.12); border-color:rgba(46,204,113,.5);}
    .btn.bad{background:rgba(255,92,92,.12); border-color:rgba(255,92,92,.5);}
    .btn:disabled{opacity:.5; cursor:not-allowed; transform:none;}

    main{max-width:900px; margin:0 auto; padding:14px;}
    .card{
      background:linear-gradient(180deg, rgba(18,27,35,.95), rgba(17,26,34,.95));
      border:1px solid var(--border);
      border-radius: var(--radius);
      padding:14px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .meta{display:flex; gap:10px; flex-wrap:wrap; margin:0 0 10px;}
    .tag{
      font-size:12px; padding:6px 10px;
      border:1px solid var(--border); border-radius:999px;
      color:var(--muted);
    }

    .qText{
      font-size:20px;
      font-weight:800;
      margin:6px 0 12px;
      line-height:1.22;
      letter-spacing:.1px;
      word-break:break-word;
    }

    .answerBox{
      border:1px dashed rgba(154,161,167,.35);
      border-radius: 12px;
      padding:12px;
      background: rgba(255,255,255,.02);
    }
    .answerBox b{
      color:var(--muted);
      font-weight:800;
      font-size:12px;
      letter-spacing:.25px;
    }
    .answerText{
      margin-top:8px;
      font-size:15px;
      line-height:1.35;
      word-break:break-word;
    }
    .muted{color:var(--muted)}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}

    .toast{
      position:fixed;
      right:14px;
      bottom:calc(14px + var(--safe-bottom) + 76px);
      z-index:10;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:rgba(18,27,35,.95);
      color:var(--text);
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      max-width: 420px;
      display:none;
    }

    /* Нижняя панель под мобилку */
    .bottomBar{
      position:sticky;
      bottom:0;
      z-index:6;
      padding:10px 12px;
      padding-bottom: calc(10px + var(--safe-bottom));
      background: rgba(15,20,25,.92);
      backdrop-filter: blur(10px);
      border-top:1px solid var(--border);
    }
    .bottomGrid{
      max-width:900px;
      margin:0 auto;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
    }
    .navGrid{
      max-width:900px;
      margin:10px auto 0;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    /* Мелкие улучшения для узких экранов */
    @media (max-width:520px){
      .wrap{padding:10px 12px;}
      main{padding:12px;}
      .card{padding:12px;}
      .qText{font-size:19px;}
      .btn{padding:12px 12px;}
      .title{font-size:15px;}
      .pill{font-size:11px;}
      .toast{right:12px; left:12px; max-width:none;}
    }
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="row nowrap">
      <div class="title">Uplink — тренажёр</div>
      <div class="spacer"></div>
      <button class="btn" id="btnReset">Сброс</button>
    </div>
    <div class="row" style="margin-top:10px;">
      <span class="pill" id="pillProgress">#— / —</span>
      <span class="pill" id="pillCat">Категория: —</span>
      <span class="pill" id="pillState">—</span>
      <div class="spacer"></div>
      <button class="btn primary" id="btnStart">Старт</button>
    </div>
  </div>
</header>

<main>
  <section class="card" id="mainCard">
    <div class="meta">
      <div class="tag" id="qNum">#—</div>
      <div class="tag" id="qSeen">просмотров: —</div>
      <div class="tag" id="qStreak">серия: —</div>
    </div>

    <div class="qText" id="question">Нажми “Старт”</div>

    <div class="answerBox">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <b>ОТВЕТ</b>
        <button class="btn primary" id="btnToggleAnswer">Показать ответ</button>
      </div>
      <div class="answerText" id="answer" style="display:none;"></div>
      <div class="answerText muted" id="answerHiddenHint" style="display:block;">Скрыто. Нажми “Показать ответ”.</div>
    </div>
  </section>
</main>

<div class="bottomBar">
  <div class="bottomGrid">
    <button class="btn bad" id="btnAgain">Не знаю</button>
    <button class="btn" id="btnHard">Частично</button>
    <button class="btn good" id="btnGood">Знаю</button>
  </div>
  <div class="navGrid">
    <button class="btn" id="btnPrev">← Предыдущий</button>
    <button class="btn" id="btnNext">Следующий →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ========= ДАННЫЕ: ВОПРОСЫ/ОТВЕТЫ (02.02.2026) =========
  const QUESTIONS = [
    { id:"q00", cat:"Речь/старт", q:"0.0 Что сказать в начале разговора (вежливый старт)?", a:"Здравствуйте! Как вы? Всё хорошо? Компания «Кабельные Сети Костаная» / ТОО «Uplink»." },
    { id:"q01", cat:"Контакты", q:"1) Номера телефонов по городам и корпоративные клиенты", a:"Костанай: 22-08-60. Лисаковск: 2-00-60. Качар: 3-90-90. Корпоративные клиенты: 90-23-23." },
    { id:"q02", cat:"Контакты", q:"2) WhatsApp, Telegram, Instagram, VK (точные названия)", a:"WhatsApp техподдержка: +7 771 058 15 55. Telegram бот: uplinkkz_bot. Instagram: @uplink.kzt. VK: up_link_kz." },
    { id:"q03", cat:"Контакты/оплата", q:"3) Что такое 220860 и когда используется?", a:"220860 — лицевой/договор для зачисления оплаты по акту, если у абонента нет лицевого счёта по Интернет или «Умный дом» (часто при продаже ключей)." },

    { id:"q04", cat:"География", q:"4) Где представлена компания (все населённые пункты)?", a:"Костанай, Кунай, Амангельды, Дружба, Мичуринское, Тобыл, Лисаковск, Октябрьский, Качар." },
    { id:"q05", cat:"Услуги по пунктам", q:"5) Где есть Кабельное ТВ, а где его нет?", a:"Кабельное ТВ есть только в Костанае и Кунае. В остальных пунктах кабельного ТВ нет." },
    { id:"q06", cat:"Услуги по пунктам", q:"6) Где есть IPTV Portal, а где его нет?", a:"IPTV Portal есть: Костанай, Кунай, Амангельды, Дружба, Мичуринское, Тобыл, Октябрьский. IPTV Portal нет: Лисаковск, Качар." },
    { id:"q07", cat:"Услуги по пунктам", q:"7) Где есть «Умный дом», а где его нет?", a:"«Умный дом» есть: Костанай, Кунай, Качар. Нет: Амангельды, Дружба, Мичуринское, Тобыл, Лисаковск, Октябрьский." },

    { id:"q08", cat:"Кассы/офисы", q:"8) Адреса офисов/пунктов оплаты (все точки)", a:"Костанай: Чкалова 16; Маяковского 120; Толстого 53; Каирбекова 383/2. Лисаковск: 3 мкрн, дом 12. Качар: ТЦ «Домовой», 3 этаж, бутик №7." },
    { id:"q09", cat:"Кассы", q:"9) Кассы: ориентиры (где есть ориентир — даём ориентир)", a:"Костанай: «9 мкрн, 10-этажный дом, напротив горводоканала»; «магазин Бахыт»; «аптека Цветная, AidanaPlaza»; «аптека Цветная». Лисаковск: «3 мкрн, дом 12, вход со стороны парка, справа от проходного подъезда». Качар: «ТЦ Домовой, 3 этаж, бутик №7»." },

    { id:"q10", cat:"Интернет/тарифы", q:"10) Тарифы интернета с 01.02.2026: скорость и цена (3 тарифа)", a:"Комфортный: до 100 Мбит/с — 5000 тг/мес. Rakhmet: до 300 Мбит/с — 6500 тг/мес (IPTV Portal бонусом). Элитный: до 500 Мбит/с — 8500 тг/мес." },
    { id:"q11", cat:"Интернет/тарифы", q:"11) Что происходит с тарифом «Люкс» после 01.02.2026?", a:"Все абоненты, которые до 01.02.2026 пользовались ТП «Люкс», переходят на ТП «Элитный»." },
    { id:"q12", cat:"Интернет/Качар", q:"12) Тарифы интернета в Качаре (после 01.02.2026)", a:"Качар (МКД Ethernet): Комфортный (до 100) — 5000; Элитный (до 500) — 8500. Тарифа Rakhmet в Качаре нет." },

    { id:"q13", cat:"Интернет/подключение", q:"13) Стоимость подключения интернета (до роутера / от роутера)", a:"До роутера: бесплатно. От роутера: согласно акту (пример: 8-жильный кабель 150 тг/м)." },
    { id:"q14", cat:"Интернет/кабель", q:"14) Где 4-жильный кабель бесплатный?", a:"Бесплатный 4-жильный кабель: Лисаковск МКД Ethernet и Качар МКД Ethernet." },
    { id:"q15", cat:"Интернет/частный сектор", q:"15) Частный сектор — подключение бесплатное или нет (по этой редакции)?", a:"По редакции 02.02.2026: до роутера бесплатно, в том числе в частном секторе." },

    { id:"q16", cat:"Технологии", q:"16) Где какая технология: Ethernet/GPON (по территориям)?", a:"Костанай МКД: Ethernet или GPON. Костанай частный сектор (Амангельды, Дружба, Мичуринское, Тобыл): GPON. Лисаковск МКД: Ethernet. Лисаковск коттеджи: GPON. Октябрьский: GPON. Качар МКД: Ethernet." },
    { id:"q17", cat:"Терминалы", q:"17) Где ставим терминалы (HGU/SFU/ONU) и где НЕ ставим?", a:"Терминалы (HGU/SFU/ONU) ставим только на GPON. На Ethernet терминалы не ставим — там только роутер." },

    { id:"q18", cat:"Оборудование", q:"18) Роутер 1 Гбит: цена продажи и аренды, кому аренда доступна", a:"2-диапазонный роутер 1 Гбит: продажа 18 000 тг; аренда 500 тг/мес (квартировладелец/арендатор)." },
    { id:"q19", cat:"Оборудование", q:"19) Роутер 100 Мбит: цена продажи и аренды; где используется", a:"2-диапазонный роутер 100 Мбит: продажа 14 000 тг; аренда 500 тг/мес. Используется в Лисаковске МКД Ethernet и Качаре МКД Ethernet." },
    { id:"q20", cat:"Оборудование/GPON", q:"20) HGU (терминал): цена продажи и аренды; где ставим (включая исключения)", a:"HGU терминал 1 Гбит: продажа 20 000 тг; аренда 500 тг/мес. Ставим: Костанай МКД GPON; в Мичуринском — только мкрн «Байтерек», многоэтажные дома." },
    { id:"q21", cat:"Оборудование/GPON", q:"21) SFU/ONU («онушка»): цена и условие предоставления; где встречается", a:"SFU/ONU: продажа 12 000 тг; условие — ответственное хранение (собственник). Встречается: Костанай GPON (в т.ч. Абая 111; у некоторых Каирбекова 387/1), Костанай частный сектор GPON, Лисаковск коттеджи GPON, Октябрьский GPON." },
    { id:"q22", cat:"Исключения", q:"22) Какие важные исключения по адресу Абая 111 / Каирбекова 387/1?", a:"Абая 111: в блоке GPON отдельно упомянуты 1 Гбит роутер и SFU/ONU как отдельный кейс. Каирбекова 387/1: SFU/ONU встречается у некоторых абонентов." },

    { id:"q23", cat:"Оплата/списания", q:"23) Какие типы списаний есть и к чему относятся (кратко)?", a:"Интернет/умный дом/аренда: ежемесячные пропорционально дням (ЕМС). Телевидение: ежемесячные фиксированные. Интернет на «Комфортный» может быть на ежедневных списаниях (ЕДС)." },
    { id:"q24", cat:"Оплата/списания", q:"24) Особенность Качара по списаниям", a:"Качар: ежемесячные списания пропорционально дням «с 16 по 16»." },

    { id:"q25", cat:"ТВ", q:"25) Абонплата ТВ: кабельное и IPTV Portal (и когда IPTV бесплатно)", a:"Кабельное ТВ: 2000 тг/мес. IPTV Portal: 2000 тг/мес. IPTV Portal бесплатно как бонус на тарифе Rakhmet (с 01.02.2026)." },
    { id:"q26", cat:"ТВ", q:"26) Стоимость первичного подключения ТВ", a:"Первичное подключение ТВ: 2500 тг (расходные материалы + остаток на лицевой счёт в счёт оплаты тарифа)." },
    { id:"q27", cat:"ТВ", q:"27) Что такое IPTV Portal и какие доп. возможности есть?", a:"IPTV Portal — просмотр ТВ через приложение по интернету. Доп. возможности: архив передач на сутки, пауза и перемотка." },
    { id:"q28", cat:"ТВ", q:"28) Сколько архив IPTV?", a:"Архив IPTV: 1 сутки (24 часа)." },
    { id:"q29", cat:"ТВ", q:"29) Случай “кабельное + IPTV вместе”: сколько платит абонент с интернетом Uplink и без него?", a:"Если подключены IPTV Portal + кабельное ТВ: без интернета Uplink — 4000 тг/мес; с интернетом Uplink — 2000 тг/мес." },
    { id:"q30", cat:"ТВ/IPTV бесплатно", q:"30) В чём точная логика “IPTV бесплатно” после 01.02.2026 (особенно Мичуринское/Тобыл/Октябрьский)?", a:"С 01.02.2026 IPTV Portal бесплатный бонус только на тарифе Rakhmet. Для Мичуринского/Тобыла/Октябрьского: на других тарифах бесплатность сохраняется только у абонентов, подключённых до 01.02.2026; новым абонентам на других тарифах после 01.02.2026 бесплатно не будет." },

    { id:"q31", cat:"Умный дом", q:"31) Что такое «Умный дом» и из чего состоит?", a:"«Умный дом» — доступ к системе «умный домофон» через программный комплекс и мобильное приложение «Мой умный дом» (ПО, базы данных и др.)." },
    { id:"q32", cat:"Умный дом", q:"32) Ключевые функции «Умного дома» (коротко списком)", a:"Видеозвонок; открытие двери при звонке и без звонка; просмотр онлайн и архив до 5 дней; временная ссылка на 24 часа; «Свободные руки»; установка на неограниченное число устройств; «Гостевой доступ» (несколько адресов при оплате каждого)." },
    { id:"q33", cat:"Умный дом", q:"33) Техусловия для «Умного дома» (что должно быть у абонента)?", a:"Должна быть установлена система «умный домофон»; у абонента приложение «Мой умный дом» (Android 6+ / iOS 14+); наличие действующего интернета любого оператора." },
    { id:"q34", cat:"Умный дом/Костанай", q:"34) Тарифы и цены «Умный дом» (Костанай): 1000/500/350 и установки/ключи", a:"Костанай: «Умный дом» 1000 тг/мес (если нет интернета Uplink); «Умный дом» для наших интернет-абонентов 500 тг/мес; «Аналоговая трубка» 350 тг/мес. Установка панели 0. Трубка абонента 2000 (кроме домов-исключений). Трубка компании 6000 (кроме исключений). Ключ 1000." },
    { id:"q35", cat:"Умный дом/Качар", q:"35) Тарифы и цены «Умный дом» (Качар): подключение до/после закрытия, тариф, годовой, ключ", a:"Качар: подключение услуги до/после закрытия панели 10 000 / 15 000 тг (включает 1 ключ). Тариф 800 тг/мес. Годовой 6000 тг/год (первая волна). Ключ 1000. Трубка абонента 2000, трубка компании 6000." },
    { id:"q36", cat:"Умный дом/ключи", q:"36) Где и как приобрести ключи (Костанай: Чкалова 16/менеджер/доставка; Качар: Домовой/бригадир)", a:"Костанай: Чкалова 16; у менеджера в назначенное время/дату по адресу установки панели; доставка с момента установки до закрытия панели (обычно до 2 рабочих дней), после закрытия — низкий приоритет (если СИ по пути). Качар: ТЦ «Домовой», 3 этаж, бутик №7; у бригадира до закрытия панели." },
    { id:"q37", cat:"Умный дом/ключи", q:"37) Как оплачиваются ключи и что делать, если нет лицевого счёта?", a:"Оплата ключей зачисляется на лицевой счёт услуги Интернет или «Умный дом». Если у абонента нет лицевого — в акте указывают 220860 и оплата поступает на него." },
    { id:"q38", cat:"Умный дом/подключение подъезда", q:"38) Условия подключения подъезда к «Умному дому» (проценты 36 квартир / меньше 36)", a:"Если ≥36 квартир: 51% подключивших услугу на тарифах 500/1000 + 2/3 подъезда согласны (или 51% дома при установке на дом). Если <36 квартир: 80% подключивших + минимум 100 ключей на подъезд + 2/3 подъезда согласны (или 51% дома при установке на дом)." },

    { id:"q39", cat:"VIP", q:"39) Что такое VIP-услуга и когда доступна?", a:"VIP — ряд бесплатных услуг, доступных абонентам на тарифе «Элитный» или при подключении Полугодового/Годового контракта." },
    { id:"q40", cat:"VIP", q:"40) Пример VIP: восстановление ОС (цена/бесплатно) и смысл", a:"Восстановление операционной системы: 3500 тг на обычных условиях, бесплатно (0) на «Элитный» (и при полугодовом/годовом контракте)." },

    { id:"q41", cat:"Белый IP", q:"41) Белый IP: где бесплатно и где платно (и что нужно сделать)?", a:"На ТП «Люкс» и «Элитный» белый IP бесплатно по запросу (как бонус). На ТП «Rakhmet» и «Комфортный» — +2000 тг к тарифу, нужно написать заявление." },

    { id:"q42", cat:"Акции", q:"42) «Под ремонт»: что это и сроки (2+2)", a:"«Под ремонт»: клиент оплачивает тариф, лицевой счёт замораживается до окончания ремонта на срок до 2 месяцев с возможностью продления ещё на 2 по заявлению. Затем оформляют заявку на установку/активацию; после 2 месяцев автоматически списывается оплата за будущий месяц и услуга запускается." },
    { id:"q43", cat:"Акции", q:"43) «Сертификат 2500» (Костанай): на что действует и как оформить?", a:"«Сертификат 2500» — скидка на первичное подключение кабельного ТВ: при одновременном подключении интернета и ТВ или при подключении ТВ для действующих интернет-абонентов. Менеджер указывает в заявке пометку «Сертификат 2500». Если материалов меньше — разница не компенсируется; если больше — клиент доплачивает." },
    { id:"q44", cat:"Акции", q:"44) «Приведи друга» (сроки и условия бонуса)", a:"«Приведи друга» (01.01.2026–01.04.2026): действующий абонент интернета (от 1 месяца) или оплативший первый месяц передаёт другу номер договора; друг указывает его при оформлении. После подключения друга обоим начисляется 1 бонусный месяц." },
    { id:"q45", cat:"Акции", q:"45) Полугодовой/годовой контракт (суть и что важно про досрочную смену тарифа)", a:"Полугодовой/годовой контракт: бонусные месяцы в подарок при полной предоплате. Действует только при единовременной оплате; можно продлевать новой предоплатой. При досрочной смене тарифа — перерасчёт по стандартным условиям без учёта бонусного периода; «добровольная заморозка» в период акции недоступна." },

    { id:"q46", cat:"Роутеры/замена", q:"46) Политика замены роутеров: что в приоритете и когда новый?", a:"Приоритет — проверенные б/у роутеры после диагностики и одобрения IT. Новый роутер — если абонент подключён менее 3 месяцев, купил новый у компании и выявлен заводской/скрытый дефект; либо если нет исправных б/у и нужна срочная замена (редко, нежелательно)." },

    { id:"q47", cat:"Термины", q:"47) Мбит и Мбайт: что меньше/что используется в тарифах?", a:"В тарифах скорость указывается в Мбит/с. Мбайт — объём данных, это другое. Для скорости всегда говорим Мбит/с." }
  ];

  // ========= ПРОГРЕСС =========
  const STORAGE_KEY = "uplink_exam_trainer_mobile_v1";
  const now = () => Date.now();

  function loadState(){
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      const init = {};
      for(const it of QUESTIONS){
        init[it.id] = {
          seen: 0,
          streak: 0,
          ease: 2.0,
          interval: 0,
          due: 0,
          lastScore: 0
        };
      }
      return { idx: 0, stats: init };
    }
    try{
      const parsed = JSON.parse(raw);
      if(!parsed.stats) parsed.stats = {};
      for(const it of QUESTIONS){
        if(!parsed.stats[it.id]){
          parsed.stats[it.id] = { seen:0, streak:0, ease:2.0, interval:0, due:0, lastScore:0 };
        }
      }
      if(typeof parsed.idx !== "number") parsed.idx = 0;
      return parsed;
    }catch(e){
      localStorage.removeItem(STORAGE_KEY);
      return loadState();
    }
  }

  function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

  function toast(msg){
    const el = document.getElementById("toast");
    el.innerHTML = msg;
    el.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(()=> el.style.display="none", 2200);
  }

  // Простая система повторения:
  // 1 => 5 мин
  // 2 => *1.5 (мин 30 мин)
  // 3 => *ease (мин 8 часов), streak++
  function applyReview(qid, score){
    const s = state.stats[qid];
    s.seen += 1;
    s.lastScore = score;

    const MIN_1 = 5 * 60 * 1000;
    const MIN_2 = 30 * 60 * 1000;
    const MIN_3 = 8 * 60 * 60 * 1000;

    if(score === 1){
      s.streak = 0;
      s.ease = Math.max(1.3, s.ease - 0.2);
      s.interval = MIN_1;
    }else if(score === 2){
      s.streak = Math.max(0, s.streak - 1);
      s.ease = Math.max(1.3, s.ease - 0.05);
      s.interval = Math.max(MIN_2, Math.round((s.interval || MIN_2) * 1.5));
    }else if(score === 3){
      s.streak += 1;
      s.ease = Math.min(2.8, s.ease + 0.08);
      const base = s.interval || MIN_3;
      s.interval = Math.max(MIN_3, Math.round(base * s.ease));
    }
    s.due = now() + s.interval;
  }

  // ========= UI =========
  const $ = (id) => document.getElementById(id);
  const state = loadState();

  let showAnswer = false;
  let pool = [];

  function buildPool(){
    // Всегда "сначала просроченное/сложное": сортируем по due (старые/0 идут вверх)
    const arr = QUESTIONS.slice();
    arr.sort((a,b)=> (state.stats[a.id].due||0) - (state.stats[b.id].due||0));
    return arr;
  }

  function current(){
    pool = buildPool();
    if(pool.length === 0) return null;
    if(state.idx >= pool.length) state.idx = 0;
    return pool[state.idx];
  }

  function escapeHtml(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;");
  }

  function formatAnswer(a){
    const lines = String(a).split("\n").map(x=>x.trim()).filter(Boolean);
    if(lines.length <= 1) return escapeHtml(a);
    return "<div>" + lines.map(l=>`<div style="margin:6px 0;">• ${escapeHtml(l)}</div>`).join("") + "</div>";
  }

  function fmtDue(qid){
    const s = state.stats[qid];
    if((s.due||0) <= now()) return "повторить";
    const d = new Date(s.due);
    return "ждёт: " + d.toLocaleString("ru-RU");
  }

  function resetView(){
    showAnswer = false;
    $("answer").style.display = "none";
    $("answer").innerHTML = "";
    $("answerHiddenHint").style.display = "block";
    $("btnToggleAnswer").textContent = "Показать ответ";
  }

  function render(){
    const cur = current();
    if(!cur){
      $("question").textContent = "Нет вопросов.";
      return;
    }

    const num = pool.findIndex(x=>x.id===cur.id) + 1;
    const total = pool.length;

    const st = state.stats[cur.id];

    $("qNum").textContent = "#" + String(QUESTIONS.findIndex(x=>x.id===cur.id)+1).padStart(2,"0");
    $("qSeen").textContent = "просмотров: " + (st.seen || 0);
    $("qStreak").textContent = "серия: " + (st.streak || 0);

    $("question").textContent = cur.q;

    $("pillProgress").textContent = "#" + num + " / " + total;
    $("pillCat").textContent = "Категория: " + cur.cat;
    $("pillState").textContent = fmtDue(cur.id);

    // если ответ уже открыт, обновляем контент
    if(showAnswer){
      $("answer").innerHTML = formatAnswer(cur.a);
    }
  }

  function move(delta){
    pool = buildPool();
    if(pool.length === 0) return;
    state.idx = (state.idx + delta + pool.length) % pool.length;
    saveState();
    resetView();
    render();
  }

  function toggleAnswer(){
    const cur = current(); if(!cur) return;
    showAnswer = !showAnswer;
    if(showAnswer){
      $("answer").innerHTML = formatAnswer(cur.a);
      $("answer").style.display = "block";
      $("answerHiddenHint").style.display = "none";
      $("btnToggleAnswer").textContent = "Скрыть ответ";
    }else{
      resetView();
    }
  }

  function review(score){
    const cur = current(); if(!cur) return;
    applyReview(cur.id, score);
    saveState();
    toast(score===3 ? "Записал: ЗНАЮ ✅" : score===2 ? "Записал: ЧАСТИЧНО ⚠️" : "Записал: НЕ ЗНАЮ ❌");
    resetView();
    // после оценки — следующая
    move(1);
  }

  // ========= EVENTS =========
  $("btnStart").onclick = () => {
    pool = buildPool();
    if(pool.length === 0){
      toast("Вопросов нет.");
      return;
    }
    state.idx = 0;
    saveState();
    resetView();
    render();
    toast("Поехали.");
  };

  $("btnToggleAnswer").onclick = toggleAnswer;
  $("btnPrev").onclick = () => move(-1);
  $("btnNext").onclick = () => move(1);

  $("btnAgain").onclick = () => review(1);
  $("btnHard").onclick  = () => review(2);
  $("btnGood").onclick  = () => review(3);

  $("btnReset").onclick = () => {
    if(!confirm("Сбросить прогресс?")) return;
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  };

  // ========= INIT =========
  render();
  toast("Готово. Нажми «Старт». Вопросов: " + QUESTIONS.length + ".");
})();
</script>
