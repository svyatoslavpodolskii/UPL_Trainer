<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Трейнер — Проверка знаний</title>
<style>
:root{
  --bg:#f5f5f7;--panel:#fff;--panel2:#f0f1f3;--text:#1d1d1f;--muted:#6e6e73;
  --line:#d2d2d7;--accent:#2f7d5a;--accent2:#246447;--good:#198754;--bad:#c63c3c;
  --shadow:0 8px 30px rgba(0,0,0,.07);--r:22px;--rs:14px
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button{font:inherit}
.shell{max-width:980px;margin:auto;padding:24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#2f7d5a,#69b98e);box-shadow:0 8px 24px rgba(47,125,90,.25)}
.brand{font-weight:700;font-size:19px}.spacer{flex:1}.small{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid rgba(0,0,0,.06);border-radius:var(--r);box-shadow:var(--shadow);padding:26px}
.hero{text-align:center;padding:36px 26px}
.hero h1{font-size:38px;line-height:1.05;letter-spacing:-1.2px;margin:0 0 12px}
.hero p{color:var(--muted);max-width:650px;margin:0 auto 26px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 26px}
.stat{background:var(--panel2);border-radius:16px;padding:16px;text-align:left}
.stat b{display:block;font-size:24px;letter-spacing:-.5px}.stat span{color:var(--muted);font-size:12px}
.progress{height:10px;background:#e6e6e9;border-radius:999px;overflow:hidden;margin:12px 0 8px}
.progress>div{height:100%;background:linear-gradient(90deg,#2f7d5a,#69b98e);width:0;transition:.25s}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:12px 19px;background:#e9e9ec;color:var(--text);cursor:pointer;font-weight:600}
.btn:hover{filter:brightness(.98)}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{color:var(--bad)}
.hidden{display:none!important}
.notice{margin-top:16px;border-radius:14px;padding:12px 14px;background:#fff4d8;color:#76520e;font-size:13px;text-align:left}
.bank{margin-top:18px;text-align:left}.bankrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}
.bankrow:last-child{border:0}.bankrow .name{flex:1}.ok{color:var(--good)}.err{color:var(--bad)}
.quizhead{display:flex;align-items:center;gap:14px;margin-bottom:18px}.counter{font-weight:700}.quizbar{flex:1;height:7px;background:#e7e7ea;border-radius:999px;overflow:hidden}.quizbar div{height:100%;background:var(--accent);transition:.2s}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:12px}.question{font-size:27px;line-height:1.18;letter-spacing:-.45px;font-weight:700;margin:0 0 24px}
.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.option:hover{background:#f8f8fa}.option.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,125,90,.12)}
.letter{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:#ededf0;display:grid;place-items:center;font-weight:700;font-size:13px}
.option.selected .letter{background:var(--accent);color:#fff}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.result h1{font-size:44px;margin:0 0 8px;letter-spacing:-1.5px}.result .sub{color:var(--muted)}
.review{margin-top:24px;display:grid;gap:12px}.reviewitem{border:1px solid var(--line);border-radius:16px;padding:16px}
.reviewitem.bad{border-color:#e6bcbc;background:#fff8f8}.reviewitem.good{border-color:#bde3cc;background:#f7fcf9}
.reviewitem h3{margin:0 0 8px;font-size:16px}.reviewitem p{margin:5px 0;color:#444}.source{font-size:12px;color:var(--muted);margin-top:8px}
.topiclist{margin-top:18px;display:grid;gap:8px}.topic{display:flex;align-items:center;gap:10px}.topic span:first-child{flex:1}
@media(max-width:720px){.shell{padding:14px}.card{padding:19px}.hero h1{font-size:31px}.stats{grid-template-columns:1fr 1fr}.question{font-size:23px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="logo"></div><div class="brand">Трейнер</div><div class="spacer"></div><div class="small" id="bankTop">Загрузка вопросов…</div></div>

  <section id="home" class="card hero">
    <h1>Проверка знаний</h1>
    <p>Один общий банк вопросов. Каждый новый запуск продолжает с тех вопросов, которые вы ещё не проходили.</p>
    <div class="stats">
      <div class="stat"><b id="sDone">0</b><span>пройдено уникальных</span></div>
      <div class="stat"><b id="sTotal">0</b><span>всего вопросов</span></div>
      <div class="stat"><b id="sErrors">0</b><span>с ошибками</span></div>
      <div class="stat"><b id="sPct">0%</b><span>покрытие банка</span></div>
    </div>
    <div class="progress"><div id="mainProgress"></div></div>
    <div class="small" id="progressText">0 из 0</div>
    <div style="height:22px"></div>
    <div class="actions">
      <button class="btn primary" id="start30">Продолжить · 30 вопросов</button>
      <button class="btn" id="start10">10 вопросов</button>
      <button class="btn" id="start50">50 вопросов</button>
      <button class="btn ghost" id="repeatErrors">Повторить ошибки</button>
    </div>
    <div id="loadWarnings"></div>
    <div class="bank" id="bankInfo"></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="quizhead">
      <div class="counter" id="counter">1 / 30</div>
      <div class="quizbar"><div id="quizProgress"></div></div>
      <button class="btn ghost" id="exitQuiz">Выйти</button>
    </div>
    <div class="qmeta" id="qmeta"></div>
    <h2 class="question" id="question"></h2>
    <div class="options" id="options"></div>
    <div class="nav">
      <button class="btn" id="prev">Назад</button>
      <button class="btn primary" id="next">Далее</button>
    </div>
  </section>

  <section id="result" class="card result hidden">
    <h1 id="resultScore">0 / 0</h1>
    <div class="sub" id="resultSub"></div>
    <div class="topiclist" id="topicResults"></div>
    <div class="actions" style="justify-content:flex-start;margin-top:22px">
      <button class="btn primary" id="continueBtn">Продолжить новые вопросы</button>
      <button class="btn" id="homeBtn">На главную</button>
    </div>
    <div class="review" id="review"></div>
  </section>
</div>

<script>
const MAX_FILES = 40;
const QUESTIONS_DIR = './questions/';
const STORAGE_KEY = 'opora_quiz_progress_v3';

let bank = [];
let loadState = { loaded: [], missing: [], errors: [] };
let progress = loadProgress();
let session = null;

function loadProgress(){
  try{
    const x = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    return x && typeof x === 'object' ? x : {};
  }catch(e){ return {}; }
}
function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }

function parseFrontMatterBlock(block, fileName, index){
  const lines = block.trim().split(/\r?\n/);
  const data = {};
  let current = null;
  for(const raw of lines){
    const line = raw.trimEnd();
    if(!line.trim() || line.trim().startsWith('<!--')) continue;
    const m = line.match(/^([А-Яа-яA-Za-zЁё_]+):\s*(.*)$/);
    if(m){
      current = m[1].toLowerCase();
      data[current] = m[2].trim();
    } else if(current){
      data[current] += '\n' + line.trim();
    }
  }

  const req = ['id','тема','тип','сложность','вопрос','варианты','ответ','объяснение'];
  const missing = req.filter(k => !data[k]);
  if(missing.length) throw new Error(`вопрос ${index}: нет полей ${missing.join(', ')}`);

  const options = data['варианты'].split(/\n|;/).map(s => s.trim()).filter(Boolean).map(s => s.replace(/^[-*]\s*/,''));
  if(options.length < 2) throw new Error(`вопрос ${index}: меньше двух вариантов`);

  let answers = data['ответ'].split('|').map(s => s.trim()).filter(Boolean);
  const type = data['тип'].toLowerCase();
  if(type === 'single' && answers.length !== 1) throw new Error(`вопрос ${index}: single должен иметь один ответ`);
  for(const a of answers) if(!options.includes(a)) throw new Error(`вопрос ${index}: ответ "${a}" отсутствует среди вариантов`);

  return {
    id:data.id.trim(),
    topic:data['тема'].trim(),
    subtopic:(data['подтема']||'').trim(),
    type,
    difficulty:data['сложность'].trim(),
    question:data['вопрос'].trim(),
    options,
    answers,
    explanation:data['объяснение'].trim(),
    source:(data['источник']||'').trim(),
    version:parseInt(data['версия']||'1',10)||1,
    file:fileName
  };
}

function parseMarkdown(text, fileName){
  const chunks = text.split(/^---\s*$/m).map(x=>x.trim()).filter(Boolean);
  const out=[];
  chunks.forEach((c,i)=>{
    // skip optional title/header chunk
    if(!/^id\s*:/mi.test(c)) return;
    out.push(parseFrontMatterBlock(c,fileName,i+1));
  });
  return out;
}

async function loadBank(){
  const jobs=[];
  for(let i=1;i<=MAX_FILES;i++){
    const file=`test${i}.md`;
    jobs.push(fetch(QUESTIONS_DIR+file,{cache:'no-store'})
      .then(async r=>{
        if(r.status===404) return {file,missing:true};
        if(!r.ok) throw new Error(`${file}: HTTP ${r.status}`);
        return {file,text:await r.text()};
      })
      .catch(e=>({file,error:e.message}))
    );
  }
  const results=await Promise.all(jobs);
  const ids=new Set();
  bank=[]; loadState={loaded:[],missing:[],errors:[]};

  for(const r of results){
    if(r.missing){ loadState.missing.push(r.file); continue; }
    if(r.error){ loadState.errors.push(r.error); continue; }
    try{
      const qs=parseMarkdown(r.text,r.file);
      for(const q of qs){
        if(ids.has(q.id)){ loadState.errors.push(`${r.file}: дубликат ID ${q.id}`); continue; }
        ids.add(q.id); bank.push(q);
      }
      loadState.loaded.push({file:r.file,count:qs.length});
    }catch(e){ loadState.errors.push(`${r.file}: ${e.message}`); }
  }
  renderHome();
}

function getRec(q){
  const p=progress[q.id]||{};
  if(p.version!==q.version) return {version:q.version,seen:0,correct:0,wrong:0,streak:0,last:null};
  return {version:q.version,seen:p.seen||0,correct:p.correct||0,wrong:p.wrong||0,streak:p.streak||0,last:p.last||null};
}
function isSeen(q){ return getRec(q).seen>0; }
function hasError(q){ return getRec(q).wrong>0; }
function isMastered(q){ const r=getRec(q); return r.streak>=2; }

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function balancedPick(source,count){
  const groups={};
  source.forEach(q=>(groups[q.topic]??=[]).push(q));
  Object.values(groups).forEach(a=>{ const b=shuffle(a); a.splice(0,a.length,...b); });
  const names=shuffle(Object.keys(groups));
  const out=[];
  let moved=true;
  while(out.length<count && moved){
    moved=false;
    for(const n of names){
      if(out.length>=count) break;
      if(groups[n].length){ out.push(groups[n].shift()); moved=true; }
    }
  }
  return out;
}

function chooseQuestions(count,mode='new'){
  let source;
  if(mode==='errors') source=bank.filter(hasError);
  else{
    const unseen=bank.filter(q=>!isSeen(q));
    const seenNotMastered=bank.filter(q=>isSeen(q)&&!isMastered(q));
    source=[...balancedPick(unseen,unseen.length),...balancedPick(seenNotMastered,seenNotMastered.length)];
  }
  return balancedPick(source,Math.min(count,source.length));
}

function startSession(count,mode='new'){
  const questions=chooseQuestions(count,mode);
  if(!questions.length){
    alert(mode==='errors'?'Нет вопросов с ошибками.':'Новых вопросов не осталось. Можно повторить ошибки или начать новый цикл после очистки прогресса.');
    return;
  }
  session={questions,index:0,answers:{},mode};
  show('quiz'); renderQuestion();
}

function renderQuestion(){
  const q=session.questions[session.index];
  document.getElementById('counter').textContent=`${session.index+1} / ${session.questions.length}`;
  document.getElementById('quizProgress').style.width=`${(session.index+1)/session.questions.length*100}%`;
  document.getElementById('qmeta').textContent=[q.topic,q.subtopic,q.difficulty].filter(Boolean).join(' · ');
  document.getElementById('question').textContent=q.question;
  const wrap=document.getElementById('options'); wrap.innerHTML='';
  const selected=session.answers[q.id]||[];
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button'); b.className='option'+(selected.includes(opt)?' selected':'');
    b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span>${escapeHtml(opt)}</span>`;
    b.onclick=()=>{
      let cur=session.answers[q.id]||[];
      if(q.type==='multiple'){
        cur=cur.includes(opt)?cur.filter(x=>x!==opt):[...cur,opt];
      }else cur=[opt];
      session.answers[q.id]=cur; renderQuestion();
    };
    wrap.appendChild(b);
  });
  document.getElementById('prev').disabled=session.index===0;
  document.getElementById('next').textContent=session.index===session.questions.length-1?'Завершить':'Далее';
}

function finishSession(){
  const results=[];
  for(const q of session.questions){
    const chosen=session.answers[q.id]||[];
    const expected=[...q.answers].sort();
    const actual=[...chosen].sort();
    const ok=expected.length===actual.length&&expected.every((v,i)=>v===actual[i]);
    const old=getRec(q);
    progress[q.id]={
      version:q.version,
      seen:old.seen+1,
      correct:old.correct+(ok?1:0),
      wrong:old.wrong+(ok?0:1),
      streak:ok?old.streak+1:0,
      last:new Date().toISOString()
    };
    results.push({q,chosen,ok});
  }
  saveProgress();
  session.results=results;
  renderResult();
}

function renderResult(){
  show('result');
  const good=session.results.filter(x=>x.ok).length;
  document.getElementById('resultScore').textContent=`${good} / ${session.results.length}`;
  document.getElementById('resultSub').textContent=`Правильных ответов: ${Math.round(good/session.results.length*100)}%. Общий прогресс сохранён локально.`;

  const per={};
  session.results.forEach(r=>{
    per[r.q.topic]??={ok:0,total:0};
    per[r.q.topic].total++; if(r.ok) per[r.q.topic].ok++;
  });
  const tr=document.getElementById('topicResults'); tr.innerHTML='';
  Object.entries(per).forEach(([name,v])=>{
    const d=document.createElement('div'); d.className='topic';
    d.innerHTML=`<span>${escapeHtml(name)}</span><span>${v.ok} / ${v.total}</span>`;
    tr.appendChild(d);
  });

  const rev=document.getElementById('review'); rev.innerHTML='';
  session.results.filter(r=>!r.ok).forEach(r=>{
    const d=document.createElement('div'); d.className='reviewitem bad';
    d.innerHTML=`<h3>${escapeHtml(r.q.question)}</h3>
      <p><b>Ваш ответ:</b> ${escapeHtml((r.chosen.length?r.chosen:['Нет ответа']).join(', '))}</p>
      <p><b>Правильно:</b> ${escapeHtml(r.q.answers.join(', '))}</p>
      <p>${escapeHtml(r.q.explanation)}</p>
      <div class="source">${escapeHtml([r.q.source,r.q.file].filter(Boolean).join(' · '))}</div>`;
    rev.appendChild(d);
  });
  renderHomeStatsOnly();
}

function renderHomeStatsOnly(){
  const total=bank.length;
  const done=bank.filter(isSeen).length;
  const errors=bank.filter(hasError).length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('sDone').textContent=done;
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sErrors').textContent=errors;
  document.getElementById('sPct').textContent=pct+'%';
  document.getElementById('mainProgress').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${done} из ${total} уникальных вопросов`;
  document.getElementById('bankTop').textContent=`Банк: ${total} вопросов`;
}

function renderHome(){
  renderHomeStatsOnly();
  const bi=document.getElementById('bankInfo'); bi.innerHTML='';
  const title=document.createElement('div'); title.className='small'; title.style.marginBottom='7px';
  title.textContent=`Загружено файлов: ${loadState.loaded.length} из ${MAX_FILES}`;
  bi.appendChild(title);
  loadState.loaded.forEach(x=>{
    const d=document.createElement('div'); d.className='bankrow';
    d.innerHTML=`<span class="name">${escapeHtml(x.file)}</span><span class="ok">${x.count} вопросов</span>`;
    bi.appendChild(d);
  });
  const lw=document.getElementById('loadWarnings'); lw.innerHTML='';
  if(loadState.errors.length){
    const d=document.createElement('div'); d.className='notice';
    d.innerHTML='<b>Есть ошибки загрузки:</b><br>'+loadState.errors.map(escapeHtml).join('<br>');
    lw.appendChild(d);
  }
  document.getElementById('start30').disabled=!bank.length;
  document.getElementById('start10').disabled=!bank.length;
  document.getElementById('start50').disabled=!bank.length;
  document.getElementById('repeatErrors').disabled=!bank.some(hasError);
}

function show(id){
  ['home','quiz','result'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

document.getElementById('start10').onclick=()=>startSession(10);
document.getElementById('start30').onclick=()=>startSession(30);
document.getElementById('start50').onclick=()=>startSession(50);
document.getElementById('repeatErrors').onclick=()=>startSession(30,'errors');
document.getElementById('prev').onclick=()=>{ if(session.index>0){session.index--;renderQuestion();} };
document.getElementById('next').onclick=()=>{
  const q=session.questions[session.index];
  if(!(session.answers[q.id]||[]).length){ alert('Выберите ответ.'); return; }
  if(session.index===session.questions.length-1) finishSession(); else {session.index++;renderQuestion();}
};
document.getElementById('exitQuiz').onclick=()=>{ if(confirm('Выйти из текущей сессии? Ответы этой сессии не будут сохранены.')){session=null;show('home');renderHome();} };
document.getElementById('homeBtn').onclick=()=>{session=null;show('home');renderHome();};
document.getElementById('continueBtn').onclick=()=>{show('home');renderHome();startSession(30);};

loadBank();
</script>
</body>
</html>
